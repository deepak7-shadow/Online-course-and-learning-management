spring:
  datasource:
    url: jdbc:h2:mem:lms_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

supabase:
  url: https://mock-test.supabase.co
  jwt:
    secret: mock-test-secret-key-must-be-at-least-32-bytes-long-for-hmac
    issuer: https://mock-test.supabase.co/auth/v1
    jwks-uri: https://mock-test.supabase.co/auth/v1/.well-known/jwks.json

app:
  cors:
    allowed-origins: http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
